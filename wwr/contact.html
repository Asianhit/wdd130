<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact US - White Water Rafting</title>
    <meta name="author" content="Samuel Christian Asian">
    <meta name="description"
      content="We'd love to hear from you! Whether you have a question about our services, need assistance.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-company.webp" alt="Rafting Company Logo">
        <nav>
            <ul class="grid">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-color">
        <section class="main-class">
            <div class="act">
                <h1>White Water Rafting Company</h1>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </div>

            <div class="contact-layout">
                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3251.1918135584056!2d-118.82076642587921!3d35.42527814399457!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80ea439789b5b46b%3A0xd6ecac8b62bf69ac!2sRiver's%20End%20Rafting%20(RER)!5e0!3m2!1sen!2sng!4v1781097966323!5m2!1sen!2sng"
                      width="400" height="300" allowfullscreen="" loading="lazy"></iframe>
                </div>

                <div class="form-container">
                    <form>
                        <fieldset>
                            <legend class="visual-hide">Contact Information</legend>

                            <div class="call">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" placeholder="Placeholder">
                            </div>

                            <div class="call">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email"
                                  placeholder="Placeholder">
                            </div>

                            <div class="call radio-group">
                                <span class="group-label">Message Purpose</span>
                                <div class="radio-options">
                                    <label><input type="radio" id="general" name="purpose"
                                          value="general"> General Inquiry</label>
                                    <label><input type="radio" id="reservation" name="purpose"
                                          value="reservation"> Reservation Question</label>
                                    <label><input type="radio" id="suggestion" name="purpose"
                                          value="suggestion"> Website Suggestion</label>
                                </div>
                            </div>

                            <div class="call text-area-group">
                                <label for="textarea">Message</label>
                                <textarea id="textarea" name="textarea"
                                  placeholder="Type here"></textarea>
                            </div>

                            <div class="call checkbox-group">
                                <input type="checkbox" id="choice" name="choice">
                                <label for="choice">Please Subscribe me to the monthly
                                    newsletter</label>
                            </div>
                        </fieldset>
                        <button type="submit">Get in Touch!</button>
                    </form>
                </div>
            </div>
        </section>

        <section>
            <div class="people">
                <h2>We Are Here to Serve You</h2>
                <div class="boss">
                    <figure>
                        <img src="images/employee1.webp" alt="profile">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employee2.webp" alt="profile">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employee3.webp" alt="profile">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Rapid Pulse Adventures. All rights reserved.</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.webp" alt="FaceBook Icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.webp" alt="Instagram Icon">
            </a>
            <a href="https://x.com">
                <img src="images/twitter-icon.webp" alt="X Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
